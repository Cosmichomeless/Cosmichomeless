name: Actualizar estadísticas

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar stats/github-stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py "${{ github.repository_owner }}"
      - name: Guardar cambios (solo si cambian las cifras)
        run: |
          if git diff --quiet -- stats/github-stats.svg; then
            echo "Sin cambios."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats/github-stats.svg
            git commit -m "Update GitHub stats card"
            git push
          fi
