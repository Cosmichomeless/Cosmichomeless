<svg xmlns="http://www.w3.org/2000/svg" width="440" height="443" viewBox="0 0 440 443" role="img" aria-label="tesela — CLI tool · macOS">
<title>tesela — CLI tool · macOS</title>
<style>
.rv-flow{stroke-dasharray:4 4;animation:rv-dash 1.2s linear infinite}
.rv-draw{stroke-dasharray:320;stroke-dashoffset:320;animation:rv-draw 3.2s ease-in-out infinite}
.rv-bar{transform-box:fill-box;transform-origin:center;animation:rv-bar 1.1s ease-in-out infinite alternate}
.rv-scan{animation:rv-scan 2.6s ease-in-out infinite alternate}
.rv-float{animation:rv-float 2.4s ease-in-out infinite alternate}
@keyframes rv-dash{to{stroke-dashoffset:-16}}
@keyframes rv-draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
@keyframes rv-bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes rv-scan{from{transform:translateY(0)}to{transform:translateY(100px)}}
@keyframes rv-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.rv-flow,.rv-draw,.rv-bar,.rv-scan,.rv-float{animation:none}.rv-draw{stroke-dashoffset:0}}
</style>
<defs>
  <clipPath id="card"><rect width="440" height="443" rx="14"/></clipPath>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".10"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="120%" r="75%">
    <stop offset="0" stop-color="#ff9e64" stop-opacity=".24"/><stop offset="1" stop-color="#ff9e64" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff9e64" flood-opacity=".4"/>
  </filter>
</defs>
<g clip-path="url(#card)">
  <rect width="440" height="443" fill="#232329"/>
  <rect width="440" height="156" fill="url(#grid)"/>
  <rect width="440" height="156" fill="url(#glow)"/>
  <path d="M0 156H440" stroke="#fff" stroke-opacity=".10"/>
</g>
<g transform="translate(82 9) scale(1.15)" color="#ff9e64" fill="none" stroke="currentColor"
   stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
<rect x="16" y="24" width="30" height="30" rx="7"/><rect x="54" y="24" width="30" height="30" rx="7"/>
<rect x="92" y="24" width="30" height="30" rx="7" fill="currentColor" fill-opacity=".22"/>
<rect x="16" y="64" width="30" height="30" rx="7" opacity=".5"/><rect x="54" y="64" width="30" height="30" rx="7" opacity=".5"/>
<rect x="92" y="64" width="30" height="30" rx="7" opacity=".5"/>
<path d="M22 36h12M22 43h7M60 36h12M60 43h7M98 36h12M98 43h7" opacity=".45"/>
<path d="M134 20v80" stroke-dasharray="3 3" opacity=".35"/>
<rect x="146" y="24" width="78" height="46" rx="6"/>
<path class="rv-flow" d="M152 62l17-17 12 12 10-8 22 18"/>
<circle class="rv-float" cx="206" cy="38" r="5" fill="currentColor" fill-opacity=".5" stroke="none"/>
<path d="M146 82h54M146 90h38M146 98h46" opacity=".5"/></g>
<text x="22" y="196" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#ededef">tesela</text>
<g>
  <rect x="242.8" y="179" width="175.2" height="24" rx="12" fill="#ff9e64" fill-opacity=".10" stroke="#ff9e64" stroke-opacity=".45"/>
  <circle cx="256.8" cy="191" r="3" fill="#ff9e64"/>
  <text x="266.8" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#ff9e64">v0.1.0 · Python script</text>
</g>
<text x="22" y="220" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing=".66" fill="#ff9e64">CLI TOOL · MACOS</text>
<text x="22" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">A terminal file manager with Finder-style icon tiles</text><text x="22" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">and real previews of PDFs, images, video and code:</text><text x="22" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">it uses Ghostty’s graphics protocol and keeps the UI</text><text x="22" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">smooth by computing everything on background</text><text x="22" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">threads.</text>
<rect x="22.0" y="359" width="58.2" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="51.1" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Python</text><rect x="86.2" y="359" width="71.6" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="122.0" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Terminal</text><rect x="163.8" y="359" width="91.7" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="209.7" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">NSWorkspace</text><rect x="261.5" y="359" width="111.8" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="317.4" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Kitty graphics</text>
<text x="22" y="419" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff9e64">View on GitHub →</text>
<rect x=".5" y=".5" width="439" height="442" rx="14" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
