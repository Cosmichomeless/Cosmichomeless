<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450" role="img" aria-label="QueueLab — Backend · Distributed systems">
<title>QueueLab — Backend · Distributed systems</title>
<style>
.rv-flow{stroke-dasharray:4 4;animation:rv-dash 1.2s linear infinite}
.rv-draw{stroke-dasharray:320;stroke-dashoffset:320;animation:rv-draw 3.2s ease-in-out infinite}
.rv-bar{transform-box:fill-box;transform-origin:center;animation:rv-bar 1.1s ease-in-out infinite alternate}
.rv-scan{animation:rv-scan 2.6s ease-in-out infinite alternate}
.rv-float{animation:rv-float 2.4s ease-in-out infinite alternate}
@keyframes rv-dash{to{stroke-dashoffset:-16}}
@keyframes rv-draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
@keyframes rv-bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes rv-scan{from{transform:translateY(0)}to{transform:translateY(100px)}}
@keyframes rv-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.rv-flow,.rv-draw,.rv-bar,.rv-scan,.rv-float{animation:none}.rv-draw{stroke-dashoffset:0}}
</style>
<defs>
  <clipPath id="card"><rect width="440" height="450" rx="14"/></clipPath>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".10"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="120%" r="75%">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".24"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2dd4bf" flood-opacity=".4"/>
  </filter>
</defs>
<g clip-path="url(#card)">
  <rect width="440" height="450" fill="#232329"/>
  <rect width="440" height="156" fill="url(#grid)"/>
  <rect width="440" height="156" fill="url(#glow)"/>
  <path d="M0 156H440" stroke="#fff" stroke-opacity=".10"/>
</g>
<g transform="translate(82 9) scale(1.15)" color="#2dd4bf" fill="none" stroke="currentColor"
   stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
<rect x="8" y="44" width="30" height="32" rx="6"/><path d="M16 56h14M16 64h9" opacity=".5"/>
<path class="rv-flow" d="M38 60h18"/>
<rect x="58" y="46" width="12" height="28" rx="3" fill="currentColor" fill-opacity=".15"/>
<rect x="74" y="46" width="12" height="28" rx="3" fill="currentColor" fill-opacity=".3"/>
<rect x="90" y="46" width="12" height="28" rx="3" fill="currentColor" fill-opacity=".5"/>
<path class="rv-flow" d="M102 60h28"/><circle cx="146" cy="60" r="14"/>
<circle cx="146" cy="60" r="5" fill="currentColor" fill-opacity=".4"/>
<path class="rv-flow" d="M160 60h28"/><path d="M190 48v26a17 6 0 0 0 34 0V48"/>
<ellipse cx="207" cy="48" rx="17" ry="6" fill="currentColor" fill-opacity=".15"/></g>
<text x="22" y="196" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#ededef">QueueLab</text>
<g>
  <rect x="262.6" y="179" width="155.4" height="24" rx="12" fill="#2dd4bf" fill-opacity=".10" stroke="#2dd4bf" stroke-opacity=".45"/>
  <circle cx="276.6" cy="191" r="3" fill="#2dd4bf"/>
  <text x="286.6" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#2dd4bf">v1.0.0 · local only</text>
</g>
<text x="22" y="220" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing=".66" fill="#2dd4bf">BACKEND · DISTRIBUTED SYSTEMS</text>
<text x="22" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">Async job platform: a REST API queues jobs in</text><text x="22" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">RabbitMQ, an independent worker processes them and</text><text x="22" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">stores the result, and a dashboard shows their</text><text x="22" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">status.</text>
<rect x="22.0" y="338" width="44.8" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="44.4" y="353" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Java</text><rect x="72.8" y="338" width="91.7" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="118.7" y="353" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Spring Boot</text><rect x="170.5" y="338" width="71.6" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="206.3" y="353" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">RabbitMQ</text><rect x="248.1" y="338" width="85.0" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="290.6" y="353" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">PostgreSQL</text><rect x="339.1" y="338" width="64.9" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="371.6" y="353" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Next.js</text><rect x="22.0" y="366" width="58.2" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="51.1" y="381" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Docker</text>
<text x="22" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2dd4bf">View on GitHub →</text>
<rect x=".5" y=".5" width="439" height="449" rx="14" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
