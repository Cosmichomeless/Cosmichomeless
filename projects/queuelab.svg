<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="QueueLab — Backend · Distributed systems">
<title>QueueLab — Backend · Distributed systems (v1.0.0 · local only)</title>
<style>
.rv-flow{stroke-dasharray:4 4;animation:rv-dash 1.2s linear infinite}
.rv-draw{stroke-dasharray:320;stroke-dashoffset:320;animation:rv-draw 3.2s ease-in-out infinite}
.rv-bar{transform-box:fill-box;transform-origin:center;animation:rv-bar 1.1s ease-in-out infinite alternate}
.rv-scan{animation:rv-scan 2.6s ease-in-out infinite alternate}
.rv-float{animation:rv-float 2.4s ease-in-out infinite alternate}
@keyframes rv-dash{to{stroke-dashoffset:-16}}
@keyframes rv-draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
@keyframes rv-bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes rv-scan{from{transform:translateY(0)}to{transform:translateY(100px)}}
@keyframes rv-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.rv-flow,.rv-draw,.rv-bar,.rv-scan,.rv-float{animation:none}.rv-draw{stroke-dashoffset:0}}
</style>
<defs>
  <clipPath id="card"><rect width="280" height="280" rx="12"/></clipPath>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".10"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="120%" r="75%">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".24"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2dd4bf" flood-opacity=".4"/>
  </filter>
</defs>
<g clip-path="url(#card)">
  <rect width="280" height="280" fill="#232329"/>
  <rect width="280" height="104" fill="url(#grid)"/>
  <rect width="280" height="104" fill="url(#glow)"/>
  <path d="M0 104H280" stroke="#fff" stroke-opacity=".10"/>
</g>
<g transform="translate(44 4) scale(0.8)" color="#2dd4bf" fill="none" stroke="currentColor"
   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
<rect x="8" y="44" width="30" height="32" rx="6"/><path d="M16 56h14M16 64h9" opacity=".5"/>
<path class="rv-flow" d="M38 60h18"/>
<rect x="58" y="46" width="12" height="28" rx="3" fill="currentColor" fill-opacity=".15"/>
<rect x="74" y="46" width="12" height="28" rx="3" fill="currentColor" fill-opacity=".3"/>
<rect x="90" y="46" width="12" height="28" rx="3" fill="currentColor" fill-opacity=".5"/>
<path class="rv-flow" d="M102 60h28"/><circle cx="146" cy="60" r="14"/>
<circle cx="146" cy="60" r="5" fill="currentColor" fill-opacity=".4"/>
<path class="rv-flow" d="M160 60h28"/><path d="M190 48v26a17 6 0 0 0 34 0V48"/>
<ellipse cx="207" cy="48" rx="17" ry="6" fill="currentColor" fill-opacity=".15"/></g>
<text x="16" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" font-weight="600" fill="#ededef">QueueLab</text>
<g>
  <rect x="200.8" y="120" width="63.2" height="20" rx="10" fill="#2dd4bf" fill-opacity=".10" stroke="#2dd4bf" stroke-opacity=".45"/>
  <circle cx="211.8" cy="130" r="2.5" fill="#2dd4bf"/>
  <text x="219.8" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#2dd4bf">v1.0.0</text>
</g>
<text x="16" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing=".6" fill="#2dd4bf">BACKEND · DISTRIBUTED SYSTEMS</text>
<text x="16" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a1a1aa">Async jobs: REST API, RabbitMQ and a</text><text x="16" y="195" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a1a1aa">worker, with a status dashboard.</text>
<rect x="16.0" y="209" width="38.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="35.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">Java</text><rect x="59.0" y="209" width="80.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="99.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">Spring Boot</text><rect x="144.0" y="209" width="62.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="175.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">RabbitMQ</text><rect x="16.0" y="234" width="74.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="53.0" y="247" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">PostgreSQL</text>
<rect x=".5" y=".5" width="279" height="279" rx="12" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
