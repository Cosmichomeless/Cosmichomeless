<svg xmlns="http://www.w3.org/2000/svg" width="280" height="299" viewBox="0 0 280 299" role="img" aria-label="FORGE — Full-stack SaaS">
<title>FORGE — Full-stack SaaS (v1.0.0 · live demo)</title>
<style>
.rv-flow{stroke-dasharray:4 4;animation:rv-dash 1.2s linear infinite}
.rv-draw{stroke-dasharray:320;stroke-dashoffset:320;animation:rv-draw 3.2s ease-in-out infinite}
.rv-bar{transform-box:fill-box;transform-origin:center;animation:rv-bar 1.1s ease-in-out infinite alternate}
.rv-scan{animation:rv-scan 2.6s ease-in-out infinite alternate}
.rv-float{animation:rv-float 2.4s ease-in-out infinite alternate}
@keyframes rv-dash{to{stroke-dashoffset:-16}}
@keyframes rv-draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
@keyframes rv-bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes rv-scan{from{transform:translateY(0)}to{transform:translateY(100px)}}
@keyframes rv-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.rv-flow,.rv-draw,.rv-bar,.rv-scan,.rv-float{animation:none}.rv-draw{stroke-dashoffset:0}}
</style>
<defs>
  <clipPath id="card"><rect width="280" height="299" rx="12"/></clipPath>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".10"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="120%" r="75%">
    <stop offset="0" stop-color="#f2cc60" stop-opacity=".24"/><stop offset="1" stop-color="#f2cc60" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f2cc60" flood-opacity=".4"/>
  </filter>
</defs>
<g clip-path="url(#card)">
  <rect width="280" height="299" fill="#232329"/>
  <rect width="280" height="104" fill="url(#grid)"/>
  <rect width="280" height="104" fill="url(#glow)"/>
  <path d="M0 104H280" stroke="#fff" stroke-opacity=".10"/>
</g>
<g transform="translate(44 4) scale(0.8)" color="#f2cc60" fill="none" stroke="currentColor"
   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"><g><rect x="14" y="14" width="68" height="92" rx="6" opacity=".55"/><path d="M22 24h24"/></g><g><rect x="86" y="14" width="68" height="92" rx="6" opacity=".55"/><path d="M94 24h24"/></g><g><rect x="158" y="14" width="68" height="92" rx="6" opacity=".55"/><path d="M166 24h24"/></g>
<rect x="20" y="34" width="56" height="16" rx="3" fill="currentColor" fill-opacity=".12"/>
<rect x="20" y="56" width="56" height="16" rx="3" fill="currentColor" fill-opacity=".12"/>
<rect x="20" y="78" width="56" height="16" rx="3" fill="currentColor" fill-opacity=".12"/>
<rect x="92" y="34" width="56" height="16" rx="3" fill="currentColor" fill-opacity=".12"/>
<rect class="rv-float" x="92" y="56" width="56" height="16" rx="3" fill="currentColor" fill-opacity=".4"/>
<rect x="164" y="34" width="56" height="16" rx="3" fill="currentColor" fill-opacity=".12"/></g>
<text x="16" y="136" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="16.5" font-weight="600" fill="#ededef">FORGE</text>
<g>
  <rect x="194.6" y="121" width="69.4" height="22" rx="11" fill="#f2cc60" fill-opacity=".10" stroke="#f2cc60" stroke-opacity=".45"/>
  <circle cx="205.6" cy="132" r="3" fill="#f2cc60"/>
  <text x="215.6" y="136" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#f2cc60">v1.0.0</text>
</g>
<text x="16" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing=".6" fill="#f2cc60">FULL-STACK SAAS</text>
<text x="16" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">Project management for small</text><text x="16" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">teams, inspired by Linear and</text><text x="16" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">Jira.</text>
<rect x="16.0" y="239" width="43.2" height="23" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="37.6" y="254.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Java</text><rect x="65.2" y="239" width="90.8" height="23" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="110.6" y="254.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Spring Boot</text><rect x="162.0" y="239" width="63.6" height="23" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="193.8" y="254.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Next.js</text>
<rect x=".5" y=".5" width="279" height="298" rx="12" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
