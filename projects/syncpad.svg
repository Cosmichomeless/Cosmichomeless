<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="SyncPad — Real-time · Offline-first">
<title>SyncPad — Real-time · Offline-first (v1.0.0 · live demo)</title>
<style>
.rv-flow{stroke-dasharray:4 4;animation:rv-dash 1.2s linear infinite}
.rv-draw{stroke-dasharray:320;stroke-dashoffset:320;animation:rv-draw 3.2s ease-in-out infinite}
.rv-bar{transform-box:fill-box;transform-origin:center;animation:rv-bar 1.1s ease-in-out infinite alternate}
.rv-scan{animation:rv-scan 2.6s ease-in-out infinite alternate}
.rv-float{animation:rv-float 2.4s ease-in-out infinite alternate}
@keyframes rv-dash{to{stroke-dashoffset:-16}}
@keyframes rv-draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
@keyframes rv-bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes rv-scan{from{transform:translateY(0)}to{transform:translateY(100px)}}
@keyframes rv-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.rv-flow,.rv-draw,.rv-bar,.rv-scan,.rv-float{animation:none}.rv-draw{stroke-dashoffset:0}}
</style>
<defs>
  <clipPath id="card"><rect width="280" height="280" rx="12"/></clipPath>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".10"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="120%" r="75%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity=".24"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#60a5fa" flood-opacity=".4"/>
  </filter>
</defs>
<g clip-path="url(#card)">
  <rect width="280" height="280" fill="#232329"/>
  <rect width="280" height="104" fill="url(#grid)"/>
  <rect width="280" height="104" fill="url(#glow)"/>
  <path d="M0 104H280" stroke="#fff" stroke-opacity=".10"/>
</g>
<g transform="translate(44 4) scale(0.8)" color="#60a5fa" fill="none" stroke="currentColor"
   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
<rect x="18" y="16" width="84" height="88" rx="6"/><rect x="138" y="16" width="84" height="88" rx="6"/>
<rect x="28" y="30" width="52" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="30" width="52" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="42" width="64" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="42" width="64" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="54" width="40" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="54" width="40" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="66" width="58" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="66" width="58" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="78" width="30" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="78" width="30" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/>
<path class="rv-flow" d="M108 50h24M132 72h-24"/>
<polygon class="rv-float" points="60,48 60,62 64,58 69,66 72,64 67,56 73,55" fill="currentColor"/>
<polygon points="180,70 180,84 184,80 189,88 192,86 187,78 193,77" fill="currentColor" fill-opacity=".55"/></g>
<text x="16" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" font-weight="600" fill="#ededef">SyncPad</text>
<g>
  <rect x="200.8" y="120" width="63.2" height="20" rx="10" fill="#60a5fa" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".45"/>
  <circle cx="211.8" cy="130" r="2.5" fill="#60a5fa"/>
  <text x="219.8" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#61a6fa">v1.0.0</text>
</g>
<text x="16" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing=".6" fill="#61a6fa">REAL-TIME · OFFLINE-FIRST</text>
<text x="16" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a1a1aa">Real-time collaborative notes that</text><text x="16" y="195" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a1a1aa">also work offline.</text>
<rect x="16.0" y="209" width="56.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="44.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">Next.js</text><rect x="77.0" y="209" width="74.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="114.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">TypeScript</text><rect x="156.0" y="209" width="74.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="193.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">WebSockets</text><rect x="16.0" y="234" width="44.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="38.0" y="247" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">CRDTs</text>
<rect x=".5" y=".5" width="279" height="279" rx="12" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
