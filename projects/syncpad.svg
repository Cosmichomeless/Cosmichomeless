<svg xmlns="http://www.w3.org/2000/svg" width="440" height="401" viewBox="0 0 440 401" role="img" aria-label="SyncPad — Real-time · Offline-first">
<title>SyncPad — Real-time · Offline-first</title>
<style>
.rv-flow{stroke-dasharray:4 4;animation:rv-dash 1.2s linear infinite}
.rv-draw{stroke-dasharray:320;stroke-dashoffset:320;animation:rv-draw 3.2s ease-in-out infinite}
.rv-bar{transform-box:fill-box;transform-origin:center;animation:rv-bar 1.1s ease-in-out infinite alternate}
.rv-scan{animation:rv-scan 2.6s ease-in-out infinite alternate}
.rv-float{animation:rv-float 2.4s ease-in-out infinite alternate}
@keyframes rv-dash{to{stroke-dashoffset:-16}}
@keyframes rv-draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
@keyframes rv-bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes rv-scan{from{transform:translateY(0)}to{transform:translateY(100px)}}
@keyframes rv-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.rv-flow,.rv-draw,.rv-bar,.rv-scan,.rv-float{animation:none}.rv-draw{stroke-dashoffset:0}}
</style>
<defs>
  <clipPath id="card"><rect width="440" height="401" rx="14"/></clipPath>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".10"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="120%" r="75%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity=".24"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#60a5fa" flood-opacity=".4"/>
  </filter>
</defs>
<g clip-path="url(#card)">
  <rect width="440" height="401" fill="#232329"/>
  <rect width="440" height="156" fill="url(#grid)"/>
  <rect width="440" height="156" fill="url(#glow)"/>
  <path d="M0 156H440" stroke="#fff" stroke-opacity=".10"/>
</g>
<g transform="translate(82 9) scale(1.15)" color="#60a5fa" fill="none" stroke="currentColor"
   stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
<rect x="18" y="16" width="84" height="88" rx="6"/><rect x="138" y="16" width="84" height="88" rx="6"/>
<rect x="28" y="30" width="52" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="30" width="52" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="42" width="64" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="42" width="64" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="54" width="40" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="54" width="40" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="66" width="58" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="66" width="58" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="28" y="78" width="30" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/><rect x="148" y="78" width="30" height="4" rx="2" fill="currentColor" fill-opacity=".25" stroke="none"/>
<path class="rv-flow" d="M108 50h24M132 72h-24"/>
<polygon class="rv-float" points="60,48 60,62 64,58 69,66 72,64 67,56 73,55" fill="currentColor"/>
<polygon points="180,70 180,84 184,80 189,88 192,86 187,78 193,77" fill="currentColor" fill-opacity=".55"/></g>
<text x="22" y="196" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#ededef">SyncPad</text>
<g>
  <rect x="269.2" y="179" width="148.8" height="24" rx="12" fill="#60a5fa" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".45"/>
  <circle cx="283.2" cy="191" r="3" fill="#60a5fa"/>
  <text x="293.2" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#61a6fa">v1.0.0 · live demo</text>
</g>
<text x="22" y="220" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing=".66" fill="#61a6fa">REAL-TIME · OFFLINE-FIRST</text>
<text x="22" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">Collaborative notes workspace that works in real</text><text x="22" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">time and offline, focused on resolving conflicts</text><text x="22" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a1a1aa">when two clients edit at once.</text>
<rect x="22.0" y="317" width="64.9" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="54.5" y="332" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">Next.js</text><rect x="92.9" y="317" width="85.0" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="135.4" y="332" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">TypeScript</text><rect x="183.9" y="317" width="85.0" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="226.4" y="332" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">WebSockets</text><rect x="274.9" y="317" width="51.5" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="300.6" y="332" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a1a1aa">CRDTs</text>
<text x="22" y="377" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#61a6fa">View on GitHub →</text>
<rect x=".5" y=".5" width="439" height="400" rx="14" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
