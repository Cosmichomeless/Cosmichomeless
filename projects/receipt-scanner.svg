<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Receipt Scanner — iOS app · OCR">
<title>Receipt Scanner — iOS app · OCR (v1.0.0 · local demo)</title>
<style>
.rv-flow{stroke-dasharray:4 4;animation:rv-dash 1.2s linear infinite}
.rv-draw{stroke-dasharray:320;stroke-dashoffset:320;animation:rv-draw 3.2s ease-in-out infinite}
.rv-bar{transform-box:fill-box;transform-origin:center;animation:rv-bar 1.1s ease-in-out infinite alternate}
.rv-scan{animation:rv-scan 2.6s ease-in-out infinite alternate}
.rv-float{animation:rv-float 2.4s ease-in-out infinite alternate}
@keyframes rv-dash{to{stroke-dashoffset:-16}}
@keyframes rv-draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
@keyframes rv-bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes rv-scan{from{transform:translateY(0)}to{transform:translateY(100px)}}
@keyframes rv-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.rv-flow,.rv-draw,.rv-bar,.rv-scan,.rv-float{animation:none}.rv-draw{stroke-dashoffset:0}}
</style>
<defs>
  <clipPath id="card"><rect width="280" height="280" rx="12"/></clipPath>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".10"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="120%" r="75%">
    <stop offset="0" stop-color="#2567ec" stop-opacity=".24"/><stop offset="1" stop-color="#2567ec" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2567ec" flood-opacity=".4"/>
  </filter>
</defs>
<g clip-path="url(#card)">
  <rect width="280" height="280" fill="#232329"/>
  <rect width="280" height="104" fill="url(#grid)"/>
  <rect width="280" height="104" fill="url(#glow)"/>
  <path d="M0 104H280" stroke="#fff" stroke-opacity=".10"/>
</g>
<g transform="translate(44 4) scale(0.8)" color="#2567ec" fill="none" stroke="currentColor"
   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
<path d="M80 10h80v98l-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6z" fill="currentColor" fill-opacity=".08"/>
<path d="M90 22h40" opacity=".5"/><path d="M90 34h54" opacity=".5"/><path d="M90 46h30" opacity=".5"/><path d="M90 58h48" opacity=".5"/><path d="M90 70h36" opacity=".5"/>
<path d="M90 86h60" stroke-width="3"/>
<path d="M62 24V8h16M178 24V8h-16M62 96v16h16M178 96v16h-16" stroke-width="2"/>
<rect class="rv-scan" x="66" y="8" width="108" height="2.5" rx="1" fill="currentColor" stroke="none"/></g>
<text x="16" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" font-weight="600" fill="#ededef">Receipt Scanner</text>
<g>
  <rect x="200.8" y="120" width="63.2" height="20" rx="10" fill="#2567ec" fill-opacity=".10" stroke="#2567ec" stroke-opacity=".45"/>
  <circle cx="211.8" cy="130" r="2.5" fill="#2567ec"/>
  <text x="219.8" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#5d8ef1">v1.0.0</text>
</g>
<text x="16" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing=".6" fill="#5d8ef1">IOS APP · OCR</text>
<text x="16" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a1a1aa">On-device receipt OCR: merchant, date,</text><text x="16" y="195" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a1a1aa">amount and currency.</text>
<rect x="16.0" y="209" width="44.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="38.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">Swift</text><rect x="65.0" y="209" width="56.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="93.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">SwiftUI</text><rect x="126.0" y="209" width="50.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="151.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">Vision</text><rect x="181.0" y="209" width="68.0" height="19" rx="5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".10"/><text x="215.0" y="222" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">VisionKit</text>
<rect x=".5" y=".5" width="279" height="279" rx="12" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
